<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --border: #e8e5df;
    --border-soft: #f0ede8;
    --text: #1a1916;
    --text-secondary: #6b6760;
    --text-tertiary: #a8a49e;
    --accent: #3d3a8c;
    --accent-light: #eeedf8;
    --accent-hover: #2e2b6e;
    --danger: #c0392b;
    --success: #27ae60;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ─── App Layout ─── */
  #app-screen { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-brand {
    font-family: 'Noto Serif Thai', serif;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (min-width: 600px) {
    header { padding: 0 24px; }
    .header-brand { font-size: 18px; }
  }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--border);
  }

  .user-avatar-placeholder {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--accent);
    border: 1.5px solid var(--border);
  }

  .btn-icon {
    background: none; border: none;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; cursor: pointer;
    color: var(--text-secondary);
    transition: background 0.15s, color 0.15s;
    font-size: 16px;
  }
  .btn-icon:hover { background: var(--bg); color: var(--text); }

  .main-content {
    flex: 1;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  @media (min-width: 768px) {
    .main-content {
      flex-direction: row;
      padding: 24px 20px;
      gap: 30px;
    }
  }

  .content-right {
    flex: 1;
    min-width: 0;
  }

  .sidebar-left {
    width: 100%;
    position: static;
    height: auto;
    overflow-y: visible;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  @media (min-width: 768px) {
    .sidebar-left {
      width: 280px;
      position: sticky;
      top: 80px;
      height: calc(100vh - 100px);
      overflow-y: auto;
      background: none;
      border: none;
      border-radius: 0;
      padding: 0 10px 0 0;
    }
  }

  .sidebar-cat-section {
    margin-bottom: 10px;
  }
  @media (min-width: 768px) {
    .sidebar-cat-section { margin-bottom: 15px; }
  }

  .sidebar-cat-header {
    font-weight: 600;
    padding: 8px 12px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    user-select: none;
  }
  @media (min-width: 768px) {
    .sidebar-cat-header { font-size: 14px; }
  }

  .sidebar-item-list {
    margin-top: 5px;
    padding-left: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-item-link {
    font-size: 13px;
    color: var(--text-secondary);
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-item-link:hover {
    background: var(--accent-light);
    color: var(--accent);
  }

  /* ─── Category Tabs ─── */
  .cats-wrapper {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 16px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .cats-wrapper::-webkit-scrollbar { display: none; }

  .cat-tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .cat-tab:hover { border-color: #bbb; color: var(--text); }
  .cat-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  /* ─── Search ─── */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
    font-size: 15px;
  }
  .search-input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-tertiary); }

  /* ─── Stats ─── */
  .stats-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    text-align: center;
  }
  .stat-num {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    font-family: 'Noto Serif Thai', serif;
  }
  .stat-label { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; white-space: nowrap; }

  @media (min-width: 600px) {
    .stats-row { gap: 10px; margin-bottom: 20px; }
    .stat-card { padding: 12px 14px; }
    .stat-num { font-size: 22px; }
    .stat-label { font-size: 11px; }
  }

  /* ─── Principle Cards ─── */
  .principles-list { display: flex; flex-direction: column; gap: 10px; }

  .principle-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
    cursor: grab;
    user-select: none;
  }
  .principle-card:active { cursor: grabbing; }
  .principle-card:hover { border-color: #ccc; box-shadow: var(--shadow); }
  .principle-card:hover .card-title { color: var(--accent); }

  .principle-card.dragging {
    opacity: 0.4;
    border: 2px dashed var(--accent);
    background: var(--accent-light);
    transform: scale(0.98);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .card-cat-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 12px;
    background: var(--accent-light);
    color: var(--accent);
    flex-shrink: 0;
  }

  .card-actions {
    display: flex;
    gap: 4px;
    opacity: 1;
  }
  @media (min-width: 768px) {
    .card-actions { opacity: 0; transition: opacity 0.15s; }
    .principle-card:hover .card-actions { opacity: 1; }
  }

  .card-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.5;
    transition: color 0.15s;
  }

  .card-body {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    pointer-events: none;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border-soft);
  }

  .card-date { font-size: 11px; color: var(--text-tertiary); }
  .card-num {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: 'Noto Serif Thai', serif;
  }

  /* ─── Empty State ─── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
  .empty-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-sub { font-size: 12px; color: var(--text-tertiary); }

  /* ─── FAB ─── */
  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 48px; height: 48px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(61,58,140,0.35);
    transition: transform 0.15s, background 0.15s;
    font-size: 22px;
    color: #fff;
    z-index: 200;
  }
  .fab:hover { background: var(--accent-hover); transform: scale(1.06); }

  @media (min-width: 600px) {
    .fab { bottom: 28px; right: 28px; width: 52px; height: 52px; font-size: 24px; }
  }

  /* ─── Modal ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  @media (min-width: 600px) {
    .modal-overlay { align-items: center; padding: 24px; }
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 560px;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 20px 24px;
    max-height: 85vh;
    overflow-y: auto;
  }
  @media (min-width: 600px) {
    .modal { border-radius: var(--radius); padding: 24px 24px 32px; max-height: 90vh; }
  }

  .modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
    display: flex; align-items: center; justify-content: space-between;
  }
  @media (min-width: 600px) { .modal-title { font-size: 17px; margin-bottom: 20px; } }

  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height: 100px; resize: vertical; line-height: 1.6; }

  .cat-input-row { display: flex; gap: 8px; align-items: center; }
  .cat-input-row .form-input { flex: 1; }

  .btn-add-cat {
    padding: 10px 12px;
    background: var(--accent-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Sarabun', sans-serif;
    transition: background 0.15s;
  }
  .btn-add-cat:hover { background: #dddcf4; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

  .btn-save {
    flex: 1;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-cancel {
    padding: 11px 16px;
    background: none;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-cancel:hover { background: var(--bg); }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1916;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    white-space: nowrap;
    z-index: 400;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── Loading ─── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-tertiary);
    font-size: 14px;
    gap: 10px;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Detail Screen ─── */
  #detail-screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }

  .detail-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .btn-back {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--accent);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 10px 6px 4px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
  }
  .btn-back:hover { background: var(--accent-light); }
  .btn-back span { font-size: 18px; line-height: 1; }

  .detail-header-actions { margin-left: auto; display: flex; gap: 4px; }

  .detail-content {
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
    padding: 24px 16px 60px;
  }
  @media (min-width: 600px) { .detail-content { padding: 40px 24px 80px; } }

  .detail-cat {
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--accent-light);
    color: var(--accent);
    margin-bottom: 16px;
  }

  .detail-title {
    font-family: 'Noto Serif Thai', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 12px;
  }
  @media (min-width: 600px) { .detail-title { font-size: 28px; margin-bottom: 16px; } }

  .detail-meta {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-soft);
  }

  .detail-meta-item { display: flex; align-items: center; gap: 4px; }

  .detail-body {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.8;
    word-break: break-word;
  }
  @media (min-width: 600px) { .detail-body { font-size: 16px; line-height: 1.9; } }

  /* ─── [เพิ่มเข้ามา] สไตล์ตกแต่งกล่องพรีวิวและบล็อกโค้ดในรายละเอียดสไตล์ Jira ─── */
  .detail-body pre.ql-syntax {
    background-color: #23241f;
    color: #f8f8f2;
    overflow: visible;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-family: monospace;
    margin: 10px 0;
  }
  .detail-body ul, .detail-body ol {
    padding-left: 24px;
    margin: 10px 0;
  }

  .detail-empty-body { font-size: 14px; color: var(--text-tertiary); font-style: italic; }
  .detail-divider { border: none; border-top: 1px solid var(--border-soft); margin: 30px 0; }

  .detail-nav {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @media (min-width: 480px) { .detail-nav { flex-direction: row; gap: 12px; } }

  .detail-nav-card {
    flex: 1;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s;
    text-decoration: none;
  }
  .detail-nav-card:hover { border-color: #bbb; }
  .detail-nav-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
  .detail-nav-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .detail-nav-card.next { text-align: left; }
  @media (min-width: 480px) { .detail-nav-card.next { text-align: right; } }

  .signout-btn {
    font-size: 13px;
    color: var(--text-tertiary);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .signout-btn:hover { color: var(--danger); background: #fdf0ef; }
  
  /* สไตล์ปุ่มสลับภาษา */
  .lang-btn {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    transition: all 0.15s;
  }
  .lang-btn:hover { background: var(--accent); color: #fff; }

  /* ─── Quote of the Day ─── */
  .quote-of-day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .quote-of-day-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .quote-of-day-text {
    font-family: 'Noto Serif Thai', serif;
    font-size: 14px;
    color: var(--text);
    line-height: 1.8;
    font-style: italic;
  }
  @media (min-width: 600px) { .quote-of-day-text { font-size: 15px; } }
  .quote-of-day-author {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 8px;
  }

  /* ─── [เพิ่มเข้ามา] สไตล์ส่วนหัวของ Quill Editor Toolbar ให้มนและเข้ากับแอป ─── */
  .ql-toolbar.ql-snow {
    border: 1px solid var(--border) !important;
    border-top-left-radius: var(--radius-sm);
    border-top-right-radius: var(--radius-sm);
    background: var(--bg);
  }
  .ql-container.ql-snow {
    border: 1px solid var(--border) !important;
    border-bottom-left-radius: var(--radius-sm);
    border-bottom-right-radius: var(--radius-sm);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="app-screen">
  <header>
    <div class="header-brand" id="header-brand">สมุดหลักการระบบ</div>
    <div class="header-right">
      <button class="lang-btn" id="lang-toggle-btn">EN</button>
      
      <div id="auth-section" style="display: flex; align-items: center; gap: 8px;">
        <button id="login-btn" class="lang-btn" style="background: var(--accent); color: white; border: none;">Login</button>
        <div id="user-profile" style="display: none; align-items: center; gap: 8px;">
          <img id="user-photo" class="user-avatar" src="" alt="User Profile">

function formatDate(ts) {
  if (!ts) return i18n[currentLang].btnSaving;
  let d;
  if (ts.toDate) {
    d = ts.toDate();
  } else if (ts instanceof Date) {
    d = ts;
  } else {
    d = new Date();
  }
  return d.toLocaleDateString(currentLang === "th" ? "th-TH" : "en-US", { 
    day: "numeric", 
    month: "short", 
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }) + (currentLang === "th" ? " น." : "");
}

// ─── Load Data ───
function loadPrinciples() {
  const col = collection(db, SHARED_COL);
  const q = query(col, orderBy("position", "asc"));

  // คลีนตัวสังเกตการณ์เก่าเพื่อลดภาระเครื่อง
  if (unsubscribe) unsubscribe();

  unsubscribe = onSnapshot(q, snapshot => {
    allPrinciples = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
    updateStats();
    renderCatTabs();
    renderSidebarMenu();
  }, err => {
    $("principles-container").innerHTML = `<div class="empty-state"><div class="empty-title">${i18n[currentLang].toastErr}</div><div class="empty-sub">${err.message}</div></div>`;
  });
}

function updateStats() {
  $("stat-total").textContent = allPrinciples.length;
  const cats = new Set(allPrinciples.map(p => p.category).filter(Boolean));
  $("stat-cats").textContent = cats.size;
  const now = new Date();
  const recent = allPrinciples.filter(p => {
    if (!p.createdAt) return false;
    const d = p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  $("stat-recent").textContent = recent.length;
}

function renderCatTabs() {
  const cats = [...new Set(allPrinciples.map(p => p.category).filter(Boolean))].sort();
  const wrapper = $("cats-wrapper");
  wrapper.innerHTML = `<button class="cat-tab ${currentCat === 'all' ? 'active' : ''}" data-cat="all" id="tab-all-btn">${i18n[currentLang].tabAll}</button>`;
  
  cats.forEach(c => {
    const btn = document.createElement("button");
    btn.className = `cat-tab ${currentCat === c ? 'active' : ''}`;
    btn.dataset.cat = c;
    btn.textContent = c;
    wrapper.appendChild(btn);
  });
  
  wrapper.querySelectorAll(".cat-tab").forEach(btn => {
    btn.onclick = () => {
      currentCat = btn.dataset.cat;
      wrapper.querySelectorAll(".cat-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAll();
    };
  });
  
  const sel = $("form-cat");
  const prev = sel.value;
  sel.innerHTML = `<option value="">${i18n[currentLang].formSelectCat}</option>`;
  cats.forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}

function renderAll() {
  const search = $("search-input").value.toLowerCase().trim();
  let list = allPrinciples;
  if (currentCat !== "all") list = list.filter(p => p.category === currentCat);
  if (search) list = list.filter(p =>
    (p.title || "").toLowerCase().includes(search) ||
    (p.body || "").toLowerCase().includes(search) ||
    (p.category || "").toLowerCase().includes(search)
  );

  const container = $("principles-container");
  if (list.length === 0) {
    const isSearching = (search || currentCat !== 'all');
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📖</div>
        <div class="empty-title">${isSearching ? i18n[currentLang].emptySearchTitle : i18n[currentLang].emptyStateTitle}</div>
        <div class="empty-sub">${isSearching ? i18n[currentLang].emptySearchSub : i18n[currentLang].emptyStateSub}</div>
      </div>`;
    return;
  }

  // ─── [ปรับปรุง] การตัดข้อความไปทำพรีวิวการ์ดด้านล่าง จะเปลี่ยนมาใช้การ Strip HTML Tag ของ Quill ออก ───
  container.innerHTML = `<div class="principles-list">${list.map((p, i) => {
    const plainTextBody = p.body ? p.body.replace(/<\/?[^>]+(>|$)/g, " ").substring(0, 120) : '';
    return `
    <div class="principle-card" 
         data-id="${p.id}"
         draggable="true" 
         ondragstart="handleDragStart(event)"
         ondragover="handleDragOver(event)"
         ondragend="handleDragEnd(event)">
      <div class="card-header">
        <span class="card-cat-badge">${p.category || i18n[currentLang].generalCat}</span>
        <div class="card-actions">
          <button class="btn-icon" onclick="event.stopPropagation();openEdit('${p.id}')" title="แก้ไข">✏️</button>
          <button class="btn-icon" onclick="event.stopPropagation();deletePrinciple('${p.id}')" title="ลบ" style="color:#c0392b">🗑</button>
        </div>
      </div>
      <div onclick="openDetail('${p.id}')" style="cursor: pointer;">
        <div class="card-title">${escHtml(p.title || '')}</div>
        <div class="card-body" style="font-size: 13px; color: var(--text-secondary); max-height: 4.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
          ${plainTextBody}
        </div>
        <div class="card-footer">
          <span class="card-date">${formatDate(p.createdAt)}</span>
          <span class="card-num">#${allPrinciples.indexOf(allPrinciples.find(x => x.id === p.id)) + 1}</span>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ─── Drag and Drop Logic ───
window.handleDragStart = (e) => {
  draggedItem = e.currentTarget;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
};

window.handleDragOver = (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const targetCard = e.currentTarget;
  
  if (targetCard && targetCard !== draggedItem) {
    const bounding = targetCard.getBoundingClientRect();
    const offset = e.clientY - bounding.top;
    if (offset > bounding.height / 2) {
      targetCard.after(draggedItem);
    } else {
      targetCard.before(draggedItem);
    }
  }
};

window.handleDragEnd = async (e) => {
  e.currentTarget.classList.remove('dragging');
  const currentCards = Array.from(document.querySelectorAll('.principle-card'));
  
  const orderMap = {};
  currentCards.forEach((card, index) => {
    orderMap[card.getAttribute('data-id')] = index;
  });
  allPrinciples.sort((a, b) => orderMap[a.id] - orderMap[b.id]);
  
  showToast(i18n[currentLang].toastOrderSaving);
  
  try {
    const batchPromises = currentCards.map((card, index) => {
      const cardId = card.getAttribute('data-id');
      const docRef = doc(db, SHARED_COL, cardId);
      return updateDoc(docRef, { position: index });
    });
    await Promise.all(batchPromises);
    showToast(i18n[currentLang].toastOrderSuccess);
  } catch (err) {
    console.error("Error saving order: ", err);
    showToast(i18n[currentLang].toastOrderFail);
  }

  renderSidebarMenu();
};

// ─── Detail View ───
let currentDetailId = null;

window.openDetail = (id) => {
  const p = allPrinciples.find(x => x.id === id);
  if (!p) return;
  currentDetailId = id;

  $("detail-cat").textContent = p.category || i18n[currentLang].generalCat;
  $("detail-title").textContent = p.title || "";
  $("detail-date").textContent = p.updatedAt ? formatDate(p.updatedAt) : formatDate(p.createdAt);
  
  const num = allPrinciples.findIndex(x => x.id === id) + 1;
  $("detail-num").textContent = `${i18n[currentLang].principleNum}${num}`;

  const bodyWrap = $("detail-body-wrap");
  
  // ─── [ปรับปรุง] การแสดงหน้าดีเทล จะพ่น HTML จาก Quill ลงไปตรงๆ เพื่อให้จัดฟอร์แมตตัวหนา / code-block ติดมาด้วย ───
  if (p.body) {
    bodyWrap.innerHTML = `<div class="detail-body ql-editor" style="padding:0;">${p.body}</div>`;
  } else {
    bodyWrap.innerHTML = `<div class="detail-empty-body">${i18n[currentLang].emptyBody}</div>`;
  }

  const idx = allPrinciples.findIndex(x => x.id === id);
  const prev = allPrinciples[idx + 1];
  const next = allPrinciples[idx - 1];
  const nav = $("detail-nav");
  const divider = $("detail-divider");

  if (prev || next) {
    divider.style.display = "block";
    nav.innerHTML = `
      ${prev ? `<div class="detail-nav-card" onclick="openDetail('${prev.id}')">
        <div class="detail-nav-label">${i18n[currentLang].navPrev}</div>
        <div class="detail-nav-title">${escHtml(prev.title || '')}</div>
      </div>` : ''}
      ${next ? `<div class="detail-nav-card next" onclick="openDetail('${next.id}')">
        <div class="detail-nav-label">${i18n[currentLang].navNext}</div>
        <div class="detail-nav-title">${escHtml(next.title || '')}</div>
      </div>` : ''}
    `;
  } else {
    divider.style.display = "none";
    nav.innerHTML = "";
  }

  $("app-screen").style.display = "none";
  $("fab-btn").style.display = "none";
  $("detail-screen").style.display = "flex";
  window.scrollTo(0, 0);
};

$("btn-back").onclick = () => {
  $("detail-screen").style.display = "none";
  $("app-screen").style.display = "flex";
  $("fab-btn").style.display = "flex";
  currentDetailId = null;
};

// ─── Quote ───
$("quote-text").textContent = `"The human race is filled with passion. And medicine, law, business, engineering, these are noble pursuits and necessary to sustain life. But poetry, beauty, romance, love, these are what we stay alive for."`;
$("quote-author").textContent = "— Dead Poets Society";

$("detail-edit-btn").onclick = () => {
  if (currentDetailId) {
    $("detail-screen").style.display = "none";
    $("app-screen").style.display = "flex";
    $("fab-btn").style.display = "flex";
    window.openEdit(currentDetailId);
  }
};

$("detail-delete-btn").onclick = async () => {
  if (!currentDetailId) return;
  if (!confirm(i18n[currentLang].confirmDel)) return;
  try {
    await deleteDoc(doc(db, SHARED_COL, currentDetailId));
    showToast(i18n[currentLang].toastDelSuccess);
    $("btn-back").click();
  } catch(e) { showToast(i18n[currentLang].toastDelFail + e.message); }
};

// ─── CRUD ───
async function savePrinciple() {
  const title = $("form-title").value.trim();
  if (!title) { showToast(i18n[currentLang].toastTitleRequired); return; }

  const btn = $("btn-save");
  btn.disabled = true; btn.textContent = i18n[currentLang].btnSaving;

  // ─── [ปรับปรุง] ดึงข้อความในกล่องเป็นรูปแแบบ Semantic HTML จากโมดูล Quill เพื่อเตรียมส่งเข้า Cloud DB ───
  const editorHtmlValue = quill.getSemanticHTML();

  const data = {
    title,
    body: editorHtmlValue,
    category: $("form-cat").value || i18n[currentLang].generalCat,
    updatedAt: serverTimestamp()
  };

  try {
    if (editingId) {
      await updateDoc(doc(db, SHARED_COL, editingId), data);
      showToast(i18n[currentLang].toastEditSuccess);
    } else {
      const col = collection(db, SHARED_COL);
      await addDoc(col, { 
        ...data, 
        position: allPrinciples.length,
        createdAt: serverTimestamp() 
      });
      showToast(i18n[currentLang].toastSaveSuccess);
    }
    closeModal();
  } catch(e) {
    showToast(i18n[currentLang].toastErr + e.message);
  } finally {
    btn.disabled = false; btn.textContent = i18n[currentLang].btnSave;
  }
}

window.deletePrinciple = async (id) => {
  if (!confirm(i18n[currentLang].confirmDel)) return;
  try {
    await deleteDoc(doc(db, SHARED_COL, id));
    showToast(i18n[currentLang].toastDelSuccess);
  } catch(e) { showToast(i18n[currentLang].toastDelFail + e.message); }
};

window.openEdit = (id) => {
  const p = allPrinciples.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  $("modal-title-text").textContent = i18n[currentLang].editTitle;
  $("form-title").value = p.title || "";
  
  // ─── [ปรับปรุง] ดันค่า HTML ข้อความเดิมที่โหลดมาจาก DB กลับเข้าไปใน Quill Editor ───
  quill.clipboard.dangerouslyPasteHTML(p.body || "");
  
  $("form-cat").value = p.category && p.category !== "ทั่วไป" && p.category !== "General" ? p.category : "";
  $("modal-overlay").classList.add("open");
};

// ─── Modal ───
function openAdd() {
  editingId = null;
  $("modal-title-text").textContent = i18n[currentLang].addTitle;
  $("form-title").value = "";
  
  // ─── [ปรับปรุง] สั่งล้างข้อมูลกล่องข้อความเก่าทิ้งก่อนเปิดหน้าต่างกรอกใหม่ ───
  quill.setText("");

  $("form-cat").value = "";
  $("modal-overlay").classList.add("open");
  setTimeout(() => $("form-title").focus(), 100);
}

function closeModal() { $("modal-overlay").classList.remove("open"); }

$("fab-btn").onclick = openAdd;
$("btn-save").onclick = savePrinciple;
$("btn-cancel").onclick = closeModal;
$("modal-close-btn").onclick = closeModal;
$("modal-overlay").onclick = e => { if (e.target === $("modal-overlay")) closeModal(); };

$("add-cat-btn").onclick = () => {
  const val = $("new-cat-input").value.trim();
  if (!val) return;
  const sel = $("form-cat");
  let exists = false;
  for (let o of sel.options) if (o.value === val) { exists = true; break; }
  if (!exists) {
    const o = document.createElement("option");
    o.value = val; o.textContent = val;
    sel.appendChild(o);
  }
  sel.value = val;
  $("new-cat-input").value = "";
};

$("new-cat-input").onkeydown = e => { if (e.key === "Enter") $("add-cat-btn").click(); };
$("search-input").oninput = () => renderAll();

function renderSidebarMenu() {
  const sidebar = $("sidebar-menu");
  if (!sidebar) return;

  const grouped = {};
  allPrinciples.forEach(p => {
    const cat = p.category || i18n[currentLang].generalCat;
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(p);
  });

  sidebar.innerHTML = `<h3 style="font-size:15px; margin-bottom:12px; color:var(--text);">${i18n[currentLang].sidebarTitle}</h3>`;

  Object.keys(grouped).sort().forEach(cat => {
    const section = document.createElement("div");
    section.className = "sidebar-cat-section";

    const header = document.createElement("div");
    header.className = "sidebar-cat-header";
    header.innerHTML = `<span>${cat} (${grouped[cat].length})</span> <span class="arrow">▼</span>`;
    
    const itemList = document.createElement("div");
    itemList.className = "sidebar-item-list";
    itemList.id = `sidebar-list-${cat}`;

    grouped[cat].forEach(p => {
      const item = document.createElement("div");
      item.className = "sidebar-item-link";
      item.textContent = p.title || "Untitled";
      item.title = p.title;
      item.onclick = () => openDetail(p.id);
      itemList.appendChild(item);
    });

    header.onclick = () => {
      const isHidden = itemList.style.display === "none";
      itemList.style.display = isHidden ? "flex" : "none";
      header.querySelector(".arrow").textContent = isHidden ? "▼" : "►";
    };

    section.appendChild(header);
    section.appendChild(itemList);
    sidebar.appendChild(section);
  });
}
</script>
</body>
