<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYShortNot</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />

    <style>
        /* ─── [ระบบตัวแปรสีสำหรับ Dark / Light Mode] ─── */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --btn-bg: #f0f0f0;
            --btn-text: #333333;
            
            /* ดึงตัวแปรเดิมในแอปของคุณมารองรับสีโหมดปกติ */
            --bg: #ffffff;
            --text: #333333;
            --border: #cccccc; 
            --radius-sm: 8px;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --btn-bg: #2a2a2a;
            --btn-text: #ffffff;
            
            /* สลับตัวแปรเดิมให้กลายเป็นสีมืด */
            --bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #444444;
        }

        /* ─── [สไตล์เดิมของคุณ] ─── */
        body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* หน้าจอหลักไอดีเดิมของคุณ */
        #app-screen {
            padding: 20px;
        }

        /* ปุ่มสวิตช์แต่งให้เรียบๆ ไม่กวนสายตา */
        .theme-btn {
            margin: 15px;
            padding: 8px 15px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Sarabun', sans-serif;
            transition: all 0.3s;
        }

        /* สไตล์ของ Quill Editor ให้เปลี่ยนสีตามโหมดมืดอัตโนมัติ */
        .ql-toolbar.ql-snow {
            border: 1px solid var(--border) !important;
            background: var(--bg) !important;
            transition: background 0.3s, border-color 0.3s;
        }
        .ql-container.ql-snow {
            border: 1px solid var(--border) !important;
            background: var(--bg) !important;
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            transition: background 0.3s, border-color 0.3s;
        }
        
        /* สลับสีไอคอนเครื่องมือ Quill ตอนโหมดมืด */
        body.dark-mode .ql-snow .ql-stroke { stroke: var(--text) !important; }
        body.dark-mode .ql-snow .ql-fill { fill: var(--text) !important; }
        body.dark-mode .ql-snow .ql-picker { color: var(--text) !important; }
    </style>
    
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode-init');
        }
    </script>
</head>
<body>

    <button id="theme-toggle" class="theme-btn">
        <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
    </button>

    <div id="app-screen">
        <header>
            <div class="header-brand" id="header-brand" style="color: var(--text); font-size: 20px; font-weight: bold; margin-bottom: 15px;">
                MYShortNot
            </div>
        </header>

        <div id="editor-container" style="height: 300px; margin-top: 10px;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        // เรียกใช้ Quill บนไอดีเดิม
        const quill = new Quill('#editor-container', {
            theme: 'snow'
        });

        // ระบบสลับโหมดมืด/สว่าง และระลึกความจำ
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function updateButtonUI(isDark) {
            themeIcon.textContent = isDark ? '☀️' : '🌙';
            themeText.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        }

        // เช็คความจำเมื่อเปิดเว็บ
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            updateButtonUI(true);
        }

        // ทำงานเมื่อกดปุ่มสลับโหมด
        themeToggleBtn.addEventListener('click', () => {
            const isDarkModeNow = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDarkModeNow ? 'dark' : 'light');
            updateButtonUI(isDarkModeNow);
        });
    </script>
</body>
</html>
