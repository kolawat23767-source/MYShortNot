<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYShortNot</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />

    <style>
        /* 1. ตั้งค่าสีในโหมดปกติ (Light Mode) */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --btn-bg: #f0f0f0;
            --btn-text: #333333;
            --border-color: #cccccc;
            
            /* ดึงตัวแปรเดิมของแอปมาร่วมใช้ในโหมดปกติ */
            --bg: #ffffff;
            --text: #333333;
            --border: #cccccc; 
            --radius-sm: 8px;
        }

        /* 2. ตั้งค่าสีเมื่อเปิด (Dark Mode) */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --btn-bg: #2a2a2a;
            --btn-text: #ffffff;
            --border-color: #444444;
            
            /* เปลี่ยนค่าตัวแปรเดิมให้กลายเป็นสีมืด */
            --bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #444444;
        }

        /* 3. นำตัวแปรสีไปใช้กับร่างกายเว็บ */
        body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* สไตล์ส่วนหัวของ Quill Editor Toolbar ให้เข้ากับ Dark Mode */
        .ql-toolbar.ql-snow {
            border: 1px solid var(--border) !important;
            border-top-left-radius: var(--radius-sm);
            border-top-right-radius: var(--radius-sm);
            background: var(--bg) !important;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .ql-container.ql-snow {
            border: 1px solid var(--border) !important;
            border-bottom-left-radius: var(--radius-sm);
            border-bottom-right-radius: var(--radius-sm);
            background: var(--bg) !important;
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .ql-snow .ql-stroke {
            stroke: var(--text) !important;
        }
        .ql-snow .ql-fill {
            fill: var(--text) !important;
        }
        .ql-snow .ql-picker {
            color: var(--text) !important;
        }

        /* สไตล์แต่งหน้าตาและการจัดวางปุ่มสวิตช์ Dark Mode */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--bg);
            border-bottom: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .theme-btn {
            padding: 8px 16px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Sarabun', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .theme-btn:hover {
            opacity: 0.8;
        }

        /* สไตล์ของพื้นที่เนื้อหาหลัก */
        #app-screen {
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2 style="margin: 0; color: var(--text);">MYShortNot</h2>
        
        <button id="theme-toggle" class="theme-btn">
            <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
        </button>
    </div>

    <div id="app-screen">
        <header>
            <div class="header-brand" id="header-brand" style="color: var(--text); font-size: 20px; font-weight: bold; margin-bottom: 15px;">
                สมุดโน้ตส่วนตัวของฉัน
            </div>
        </header>

        <div id="editor-container" style="height: 300px; margin-top: 10px;">
            <p>พิมพ์ข้อความสั้นๆ หรือโน้ตสำคัญของคุณที่นี่...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script>
        // เริ่มการทำงานของ Quill Editor
        const quill = new Quill('#editor-container', {
            theme: 'snow'
        });

        // ────────────────────────────────────────────────────────
        // ระบบควบคุมการสลับ Dark Mode / Light Mode และระลึกความจำ
        // ────────────────────────────────────────────────────────
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        // 1. ตรวจสอบความจำเดิมในเบราว์เซอร์ตอนเข้าเว็บ
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        }

        // 2. ระบบดักจับการกดปุ่มสลับโหมด
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark'); // บันทึกความจำโหมดมืด
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                localStorage.setItem('theme', 'light'); // บันทึกความจำโหมดสว่าง
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        });
    </script>
</body>
</html>
